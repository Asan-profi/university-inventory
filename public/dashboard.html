<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventarizatsiya Platformasi</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h1>🏛️ Inventarizatsiya</h1>
  <nav>
    <a href="/dashboard.html" class="active">Bosh sahifa</a>
    <a href="/admin.html" id="adminLink" style="display:none;">Admin panel</a>
  </nav>
  <div class="userbox">
    <span id="whoami"></span>
    <button class="secondary" id="btnChangePw">Parolni o'zgartirish</button>
    <button class="secondary" id="btnLogout">Chiqish</button>
  </div>
</header>

<main>
  <div class="card" id="addCard">
    <h2>Yangi buyum qo'shish</h2>

    <label>1. Kategoriya tanlang</label>
    <div class="cat-keyboard" id="catKeyboard"></div>
    <div class="status err" id="catStatus" style="margin-bottom:10px;"></div>

    <div class="grid">
      <div class="field"><label>Jihoz nomi *</label><input id="f_name" required></div>
      <div class="field"><label>Brend</label><input id="f_brand" placeholder="Masalan: Dell, HP, Lenovo"></div>
      <div class="field"><label>Model</label><input id="f_model"></div>
      <div class="field"><label>Texnik tavsifi</label><input id="f_techspec" placeholder="Masalan: i5/16GB/512GB"></div>
      <div class="field"><label>Miqdori</label><input id="f_qty" type="number" min="1" value="1"></div>
      <div class="field"><label>O'lchov birligi</label>
        <select id="f_unit"><option>dona</option><option>komplekt</option><option>metr</option><option>kg</option><option>litr</option></select>
      </div>
      <div class="field"><label>Kelgan sana</label><input id="f_date" type="date"></div>
      <div class="field"><label>Qiymati (so'm)</label><input id="f_price" type="number" min="0" step="1000"></div>
      <div class="field"><label>Hujjat № (naklad./akt)</label><input id="f_docnum"></div>
      <div class="field"><label>Yetkazib beruvchi</label><input id="f_supplier"></div>
      <div class="field"><label>Filial</label><input id="f_branch" placeholder="Masalan: Nukus"></div>
      <div class="field"><label>Bino</label><input id="f_building" placeholder="Masalan: Asosiy bino"></div>
      <div class="field"><label>Xona (kabinet) *</label><input id="f_room" required></div>
      <div class="field"><label>Bo'lim / Kafedra *</label><input id="f_dept" required></div>
      <div class="field"><label>Mas'ul shaxs (F.I.Sh)</label><input id="f_responsible"></div>
      <div class="field"><label>Holati</label>
        <select id="f_condition"><option value="">—</option><option>Yangi</option><option>Yaxshi</option><option>Qoniqarli</option><option>Eskirgan</option><option>Nosoz</option></select>
      </div>
      <div class="field"><label>Status</label>
        <select id="f_status"><option>Foydalanishda</option><option>Omborda</option><option>Ta'mirda</option><option>Hisobdan chiqarilgan</option></select>
      </div>
    </div>
    <div class="field"><label>Izoh</label><textarea id="f_note"></textarea></div>
    <button id="btnAdd">➕ Qo'shish (Inventar raqami avtomatik yaratiladi)</button>
    <div class="status" id="addStatus"></div>
  </div>

  <div class="card">
    <h2>Inventarizatsiya ro'yxati</h2>
    <div class="filters">
      <input id="q" placeholder="Qidirish...">
      <select id="fDept"><option value="">Barcha bo'limlar</option></select>
      <select id="fRoom"><option value="">Barcha xonalar</option></select>
      <select id="fCat"><option value="">Barcha kategoriyalar</option></select>
      <button class="secondary" id="btnRefresh">Yangilash</button>
      <button id="btnExport">📊 Excel'ga eksport</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Inventar №</th><th>Nomi</th><th>Kategoriya</th><th>Xona</th><th>Bo'lim</th><th>Mas'ul shaxs</th><th>Status</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">Yozuv topilmadi.</div>
    </div>
  </div>
</main>

<!-- Batafsil modal -->
<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Buyum tafsilotlari</h2>
      <button class="secondary" id="modalClose">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
